services:
  postgres:
    image: postgres:16-alpine
    container_name: dart-postgres
    restart: always
    environment:
      POSTGRES_USER: dart_user
      POSTGRES_PASSWORD: dart_password
      POSTGRES_DB: dart_db
    ports:
      - "5432:5432"
    volumes:
      - dart_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dart-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - dart_redisdata:/data

volumes:
  dart_pgdata:
  dart_redisdata:
